<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>orch queue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23b4540a'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --dim: #6b6a66; --line: #e2e0da; --sel: #fff4d6; --accent: #b4540a;
  --decision: #b4540a; --blocked: #c0262d; --question: #7a4fc4; --idea: #1f7a6d; --merge: #2a62c9; --deploy: #8a6d00;
  --ok: #1f7a3a; --err: #c0262d;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --dim: #9a9890; --line: #2f2e2b; --sel: #33291a; --accent: #f0a050;
    --decision: #f0a050; --blocked: #ff6b6b; --question: #b79cf2; --idea: #5cc8b5; --merge: #7ea6ff; --deploy: #e0c050; --ok: #6fd08a; --err: #ff6b6b; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--dim); font-size: 13px; }
header .keys { margin-left: auto; color: var(--dim); font-size: 12px; }
kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
main { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; height: calc(100vh - 50px); }
#list { overflow-y: auto; border-right: 1px solid var(--line); padding-bottom: 70px; }
.row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; font: inherit; padding: 10px 16px; cursor: pointer; }
.row.sel { background: var(--sel); }
.row.sent { opacity: .55; }
.row .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .s { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
#detail { overflow-y: auto; padding: 18px 24px 120px; }
#detail h2 { font-size: 19px; margin: 4px 0 4px; line-height: 1.3; }
#detail .who { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
.rec { border-left: 3px solid var(--accent); background: var(--panel); padding: 10px 14px; margin: 0 0 16px; border-radius: 0 6px 6px 0; }
.rec b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 2px; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.links a { color: var(--merge); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; background: var(--panel); overflow-wrap: anywhere; }
.media { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-bottom: 16px; }
.media img, .media video { width: 100%; border-radius: 6px; border: 1px solid var(--line); background: #000; display: block; }
.media a { display: block; }
.media .cap { font-size: 11px; color: var(--dim); overflow-wrap: anywhere; margin-top: 2px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; }
#bar .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#bar button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
#bar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#bar button.primary kbd { background: transparent; color: inherit; border-color: rgba(255,255,255,.6); }
#bar textarea { width: 100%; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; min-height: 60px; }
#bar .confirm { font-size: 14px; }
#bar .status { font-size: 13px; color: var(--dim); }
#bar .status.ok { color: var(--ok); } #bar .status.err { color: var(--err); }
.empty { padding: 40px 24px; color: var(--dim); }
@media (max-width: 760px) {
  header .keys, #bar kbd, #bar [data-act="up"], #bar [data-act="down"] { display: none; }
  main { display: block; height: auto; }
  #list { border-right: 0; max-height: 40vh; }
  #detail { padding: 14px 16px 160px; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<header><h1>orch queue</h1><span class="meta" id="meta">loading…</span>
<span class="keys"><kbd>j</kbd>/<kbd>k</kbd> move · <kbd>a</kbd> accept · <kbd>r</kbd> reject · <kbd>e</kbd> edit · <kbd>Esc</kbd> cancel</span></header>
<main><nav id="list"></nav><section id="detail"></section></main>
<div id="bar"></div>
<script>
const LABEL = { decision: 'decision', blocked: 'blocked', question: 'worker asks', idea: 'idea ask', merge: 'merge', deploy: 'deploy' };
let items = [], sel = 0, mode = null, draft = '', status = { text: '', cls: '' }, busy = false, selKey = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = p => p.split('/').pop();
const cur = () => items[sel];
// Ledger times come as local "YYYY-MM-DD HH:MM" (decisions, log) or ISO UTC (feed, ideas); show both as local.
const pad = n => String(n).padStart(2, '0');
const local = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const when = s => !s ? '' : /T.*(Z|[+-]\d\d:?\d\d)$/.test(s) ? local(new Date(s)) : s.slice(0, 16);

async function load() {
  try {
    const r = await fetch('/api/queue', { cache: 'no-store' });
    const d = await r.json();
    items = d.items;
    const i = items.findIndex(x => x.key === selKey);
    sel = i >= 0 ? i : Math.min(sel, Math.max(0, items.length - 1));
    selKey = cur()?.key ?? null;
    const open = items.filter(x => !x.sent).length;
    $('meta').textContent = `${open} waiting${items.length > open ? `, ${items.length - open} sent` : ''} · updated ${when(d.at).slice(11)}`;
    renderList(); if (!mode) renderDetail(); renderBar();
  } catch (e) { $('meta').textContent = `cannot reach the queue server: ${e.message}`; }
}

function renderList() {
  $('list').innerHTML = items.length ? items.map((x, i) => `
    <button class="row${i === sel ? ' sel' : ''}${x.sent ? ' sent' : ''}" data-i="${i}">
      <span class="t"><span class="tag" style="color:var(--${x.kind})">${LABEL[x.kind]}</span>${esc(x.title)}</span>
      <span class="s">${esc(x.who)}${x.since ? ` · ${esc(when(x.since))}` : ''}${x.sent ? ` · sent ${esc(x.sent.at)}` : ''}</span>
    </button>`).join('') : '<div class="empty">Nothing waits on you.</div>';
}

let shown = '';
// The poll calls this every 5 s; rewriting the same item would reload its images, restart clips and lose the scroll.
function renderDetail() {
  const x = cur();
  const sig = JSON.stringify(x ?? null);
  if (sig === shown) return;
  shown = sig;
  if (!x) { $('detail').innerHTML = ''; return; }
  const media = x.media.map(p => {
    const u = `/media?p=${encodeURIComponent(p)}`;
    return /\.(mp4|webm|mov)$/i.test(p)
      ? `<div><video src="${u}" controls muted playsinline preload="metadata"></video><div class="cap">${esc(base(p))}</div></div>`
      : `<div><a href="${u}" target="_blank"><img src="${u}" alt="${esc(base(p))}"></a><div class="cap">${esc(base(p))}</div></div>`;
  }).join('');
  const links = [...x.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noreferrer">${esc(l.label)}</a>`),
    ...x.docs.map(p => `<a href="/doc?p=${encodeURIComponent(p)}" target="_blank">${esc(base(p))}</a>`)].join('');
  $('detail').innerHTML = `
    <span class="tag" style="color:var(--${x.kind})">${LABEL[x.kind]}</span>
    <h2>${esc(x.title)}</h2>
    <div class="who">${esc(x.who)}${x.since ? ` · ${esc(when(x.since))}` : ''}</div>
    ${x.recommendation ? `<div class="rec"><b>Recommendation</b>${esc(x.recommendation)}</div>` : ''}
    ${links ? `<div class="links">${links}</div>` : ''}
    ${x.detail && x.detail.length < 400 ? `<div class="text">${esc(x.detail)}</div>` : ''}
    ${media ? `<div class="media">${media}</div>` : ''}
    ${x.detail && x.detail.length >= 400 ? `<div class="text">${esc(x.detail)}</div>` : ''}`;
  $('detail').scrollTop = 0;
}

function renderBar() {
  const x = cur();
  const st = status.text ? `<span class="status ${status.cls}">${esc(status.text)}</span>` : '';
  if (!x) { $('bar').innerHTML = `<div class="btns">${st}</div>`; return; }
  if (mode === 'accept') {
    $('bar').innerHTML = `<div class="confirm">Send to orch: <b>${esc(x.answers.accept)}</b></div>
      <div class="btns"><button class="primary" data-act="send">Send <kbd>a</kbd>/<kbd>Enter</kbd></button><button data-act="cancel">Cancel <kbd>Esc</kbd></button>${st}</div>`;
    return;
  }
  if (mode === 'reject' || mode === 'edit') {
    if (!$('answer')) {
      $('bar').innerHTML = `<textarea id="answer" rows="2"></textarea>
        <div class="btns"><button class="primary" data-act="send">Send <kbd>Enter</kbd></button><button data-act="cancel">Cancel <kbd>Esc</kbd></button><span id="st"></span></div>`;
      const t = $('answer'); t.value = draft; t.focus(); t.setSelectionRange(t.value.length, t.value.length);
      t.addEventListener('input', () => { draft = t.value; });
    }
    $('st').innerHTML = st;
    return;
  }
  $('bar').innerHTML = `<div class="btns">
    <button data-act="accept" class="primary">Accept <kbd>a</kbd></button>
    <button data-act="reject">Reject <kbd>r</kbd></button>
    <button data-act="edit">Edit <kbd>e</kbd></button>
    <button data-act="up">↑ <kbd>k</kbd></button><button data-act="down">↓ <kbd>j</kbd></button>
    ${x.sent ? `<span class="status">sent ${esc(x.sent.at)}: ${esc(x.sent.text)}</span>` : st}</div>`;
}

function move(d) {
  if (mode || !items.length) return;
  sel = Math.max(0, Math.min(items.length - 1, sel + d)); selKey = cur().key; status = { text: '', cls: '' };
  renderList(); renderDetail(); renderBar();
  $('list').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}
function start(m) {
  const x = cur(); if (!x || busy) return;
  mode = m; status = { text: '', cls: '' };
  draft = m === 'reject' ? x.answers.reject : m === 'edit' ? x.answers.edit : '';
  renderBar();
}
function cancel() { mode = null; draft = ''; renderBar(); renderDetail(); }

async function send() {
  const x = cur(); if (!x || busy) return;
  const text = mode === 'accept' ? x.answers.accept : draft.trim();
  busy = true; status = { text: 'sending to orch…', cls: '' }; renderBar();
  try {
    const r = await fetch('/api/answer', { method: 'POST', headers: { 'content-type': 'application/json', 'x-orch': 'queue' }, body: JSON.stringify({ key: x.key, text }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    mode = null; draft = ''; status = { text: `sent: ${text}`, cls: 'ok' };
    const next = items.findIndex((y, i) => i > sel && !y.sent);
    if (next >= 0) { sel = next; selKey = items[next].key; }
  } catch (e) { status = { text: `not sent: ${e.message}`, cls: 'err' }; }
  busy = false;
  await load(); renderDetail(); renderBar();
}

$('list').addEventListener('click', e => { const b = e.target.closest('.row'); if (b && !mode) { sel = +b.dataset.i; selKey = cur().key; status = { text: '', cls: '' }; renderList(); renderDetail(); renderBar(); if (matchMedia('(max-width: 760px)').matches) $('detail').scrollIntoView({ behavior: 'smooth' }); } });
$('bar').addEventListener('click', e => {
  const a = e.target.closest('button')?.dataset.act;
  ({ accept: () => start('accept'), reject: () => start('reject'), edit: () => start('edit'), send, cancel, up: () => move(-1), down: () => move(1) })[a]?.();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (mode === 'reject' || mode === 'edit') {
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    return;
  }
  if (mode === 'accept') {
    if (e.key === 'Escape') cancel();
    else if (e.key === 'Enter' || e.key === 'a') { e.preventDefault(); send(); }
    return;
  }
  const k = { j: () => move(1), ArrowDown: () => move(1), k: () => move(-1), ArrowUp: () => move(-1), a: () => start('accept'), r: () => start('reject'), e: () => start('edit') }[e.key];
  if (k) { e.preventDefault(); k(); }
});
load();
setInterval(() => { if (!busy) load(); }, 5000);
</script>
</body>
</html>
